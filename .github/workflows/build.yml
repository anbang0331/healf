name: Build HealF

on:
  workflow_dispatch:   # Actions 탭에서 [Run workflow] 버튼으로 실행
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest        # 애플 실리콘(M1/M2/M3/M4) 맥용
            label: Mac-AppleSilicon
          - os: macos-15-intel      # 인텔 맥용
            label: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli flet-desktop pyinstaller
      - name: Patch flet-cli bug (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib, importlib.util
          spec = importlib.util.find_spec("flet_cli")
          base = pathlib.Path(list(spec.submodule_search_locations)[0])
          p = base / "__pyinstaller" / "win_utils.py"
          s = p.read_text(encoding="utf-8")
          bad = 'open(exe_path, "ab", encoding="utf-8")'
          print("found bug line:", bad in s)
          p.write_text(s.replace(bad, 'open(exe_path, "ab")'), encoding="utf-8")
          print("patched:", p)
      - name: Build
        run: flet pack healf_ver_2.py --name HealF
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent HealF.app HealF-${{ matrix.label }}.zip
      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: HealF-${{ matrix.label }}
          path: dist/HealF.exe
      - name: Upload (Mac)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: HealF-${{ matrix.label }}
          path: dist/HealF-${{ matrix.label }}.zip
